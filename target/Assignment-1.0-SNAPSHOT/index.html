<!DOCTYPE html>
<html lang="en">
    <head>
        <title>CD Store - Murach's Java Servlets and JSP</title>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles/main.css" type="text/css"/>
    </head>
    <body>
        <div class="container">
            <div class="header">
                <div class="header-title-group">
                    <div class="header-icon">🎵</div>
                    <div>
                        <h1>CD List</h1>
                        <div class="subtitle">Select your favorite music albums</div>
                    </div>
                </div>
            </div>
            
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Description</th>
                            <th class="right" style="width: 110px;">Price</th>
                            <th class="center" style="width: 170px;">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td class="desc-cell">86 (the band) - True Life Songs and Pictures</td>
                            <td class="right"><span class="price-tag">$14.95</span></td>
                            <td class="center">
                                <form action="cart" method="post">
                                    <input type="hidden" name="action" value="cart">
                                    <input type="hidden" name="productCode" value="8601">
                                    <button type="submit" class="btn btn-primary">
                                        🛒 Add To Cart
                                    </button>
                                </form>
                            </td>
                        </tr>
                        <tr>
                            <td class="desc-cell">Paddlefoot - The first CD</td>
                            <td class="right"><span class="price-tag">$12.95</span></td>
                            <td class="center">
                                <form action="cart" method="post">
                                    <input type="hidden" name="action" value="cart">
                                    <input type="hidden" name="productCode" value="pf01">
                                    <button type="submit" class="btn btn-primary">
                                        🛒 Add To Cart
                                    </button>
                                </form>
                            </td>
                        </tr>
                        <tr>
                            <td class="desc-cell">Paddlefoot - The second CD</td>
                            <td class="right"><span class="price-tag">$14.95</span></td>
                            <td class="center">
                                <form action="cart" method="post">
                                    <input type="hidden" name="action" value="cart">
                                    <input type="hidden" name="productCode" value="pf02">
                                    <button type="submit" class="btn btn-primary">
                                        🛒 Add To Cart
                                    </button>
                                </form>
                            </td>
                        </tr>
                        <tr>
                            <td class="desc-cell">Joe Rut - Genuine Wood Grained Finish</td>
                            <td class="right"><span class="price-tag">$14.95</span></td>
                            <td class="center">
                                <form action="cart" method="post">
                                    <input type="hidden" name="action" value="cart">
                                    <input type="hidden" name="productCode" value="jr01">
                                    <button type="submit" class="btn btn-primary">
                                        🛒 Add To Cart
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            
            <div class="actions-footer">
                <span class="subtitle">Session & Cookie Demo • MVC Architecture</span>
                <form action="cart" method="post">
                    <input type="hidden" name="action" value="cart">
                    <button type="submit" class="btn btn-secondary">
                        🛍 View Cart
                    </button>
                </form>
            </div>
        </div>
    </body>
</html>
